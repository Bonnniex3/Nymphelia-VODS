<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head><body>
<div class="stage" style="width:1280px;height:720px">
  <div class="glow"></div><div class="dots" style="background-size:16px 16px"></div><div class="scan"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:22px;display:grid;grid-template-columns:repeat(7,1fr);opacity:.8">
    <div style="background:#fff7fa"></div><div style="background:#fbcfe8"></div><div style="background:#f78fc4"></div><div style="background:#c3a6ff"></div><div style="background:#8f7ae6"></div><div style="background:#c25588"></div><div style="background:#3c222a"></div></div>
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <div class="pfp" style="position:relative;width:210px;height:210px"><div class="halo"></div><div class="ring"></div><img src="../../src/assets/pfp.png"></div>
    <div class="holo" style="font-family:'Unbounded Variable';font-weight:900;font-size:96px;letter-spacing:-4px;line-height:.9;margin-top:10px">NYMPHELIA</div>
    <div class="dot" style="font-size:30px;color:#f78fc4;letter-spacing:6px;text-shadow:0 0 16px rgb(247 143 196/.6)">✦ VOD ARCHIVE ✦ ニンフェリア ✦</div>
  </div>
  <span class="star" style="position:absolute;left:120px;top:110px;color:#fff7fa;font-size:40px"></span>
  <span class="star" style="position:absolute;right:150px;top:170px;color:#c3a6ff;font-size:26px"></span>
  <span class="star" style="position:absolute;right:240px;bottom:140px;color:#f78fc4;font-size:32px"></span>
</div></body></html>
